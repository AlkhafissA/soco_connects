<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Fichier Trop Lourd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Poppins", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      /* J'ai changé la bordure du haut en rouge (#dc3545) pour indiquer un blocage de sécurité */
      .error-container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-top: 5px solid #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1 class="display-1 fw-bold text-danger">413</h1>
      <h3>Fichier trop volumineux !</h3>
      <p class="text-muted">
        Le document que vous essayez d'importer dépasse la limite maximale autorisée (5 Mo).<br />Veuillez compresser votre fichier et réessayer.
      </p>
      <button onclick="window.history.back()" class="btn btn-danger rounded-pill px-4 mt-3">Retour à la page précédente</button>
    </div>
  </body>
</html>
