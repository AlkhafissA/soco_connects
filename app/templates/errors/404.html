<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page Introuvable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-container { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h3>Oups ! Page introuvable</h3>
        <p class="text-muted">L'adresse demandée n'existe pas ou a été déplacée.</p>
        <a href="/" class="btn btn-primary rounded-pill px-4">Retour à l'accueil</a>
    </div>
</body>
</html>
