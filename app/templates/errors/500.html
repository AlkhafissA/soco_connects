<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur Système</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-container { text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #dc3545; max-width: 500px; }
        .icon-box { font-size: 60px; color: #dc3545; margin-bottom: 20px; }
        h1 { font-weight: 700; color: #333; }
        p { color: #666; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon-box">⚙️</div>
        <h1>Erreur 500</h1>
        <p>Une erreur technique s'est produite. Le Contrôle Général a été notifié automatiquement par le journal d'audit.</p>
        <a href="/" class="btn btn-dark px-4 py-2 rounded-pill fw-bold">Retour au Tableau de Bord</a>
    </div>
</body>
</html>
