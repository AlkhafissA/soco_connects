{% extends "base.html" %}

{% block title %}Demande d'accès - SOCO-CONNECT{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-building-add display-4 text-success mb-3"></i>
                        <h2 class="fw-bold">Demande de création de compte</h2>
                        <p class="text-muted">Veuillez remplir ce formulaire. Notre service HSE examinera votre demande.</p>
                    </div>

                    <form action="{{ url_for('main.demande_acces') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nom de l'entreprise</label>
                            <input type="text" class="form-control" name="nom_entreprise" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nom complet du contact (Gérant/Responsable)</label>
                            <input type="text" class="form-control" name="nom_contact" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small">Email professionnel</label>
                                <input type="email" class="form-control" name="email_contact" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small">Téléphone</label>
                                <input type="tel" class="form-control" name="telephone" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">Motif / Secteur d'intervention</label>
                            <textarea class="form-control" name="motif" rows="3" placeholder="Ex: Travaux de maintenance électrique, Projet extension..."></textarea>
                        </div>

                        <!-- Honeypot -->
                        <div style="display:none;"><input type="text" name="confirm_email_address"></div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">Soumettre la demande</button>
                            <a href="{{ url_for('main.login') }}" class="btn btn-light">Retour à la connexion</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
